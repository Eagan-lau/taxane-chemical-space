[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxane-reaction-grammar-space"
version = "1.0.0"
description = "Evidence-stratified reaction-grammar construction and G0-G3 exploration of taxane chemical space."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Yugeng Liu"},
    {name = "Yirou Li"},
    {name = "Junsen Cheng"},
    {name = "Zhe Wang"},
    {name = "Pierre Delaplace"},
    {name = "Jianbin Yan"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.9"]
test = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/Eagan-lau/taxane-chemical-space"

[project.scripts]
taxane-grammar-space = "taxane_reaction_grammar_space.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
